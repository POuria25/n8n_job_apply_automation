services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=15",
              "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB",
              "-c", "effective_cache_size=64MB"]
    mem_limit: 128m
    oom_score_adj: 900
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: n8n
    volumes: [pg_data:/var/lib/postgresql/data]

  n8n:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:5678:5678"]
    mem_limit: 450m
    memswap_limit: 1g
    oom_score_adj: 1000
    environment:
      - NODE_OPTIONS=--max-old-space-size=300
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${PG_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      - NODES_EXCLUDE=[]
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=72
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - GENERIC_TIMEZONE=Europe/Luxembourg
      - TZ=Europe/Luxembourg
      - N8N_SECURE_COOKIE=false
      - TECTONIC_CACHE_DIR=/data/tectonic-cache
    volumes:
      - n8n_data:/home/node/.n8n
      - tectonic_cache:/data/tectonic-cache
      - ./assets:/data/assets:ro
      - jobs:/data/jobs
    depends_on: [postgres]

volumes: { pg_data: {}, n8n_data: {}, tectonic_cache: {}, jobs: {} }
